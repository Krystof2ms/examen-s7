<article class="bg-white my-4 mx-12 rounded-2xl flex flex-col items-center p-4">
    <img [src]="img()" [alt]="name()" class="w-40">
    
    <div class="self-baseline">
        <span class="text-gray-400">{{ company() }}</span>
        <h3 class="font-medium">{{ name() }}</h3>
    </div>

    <div>
        <p class="font-semibold"> S/.{{ price() }}</p>
        @if (discount()) {
            <div>
                <span> S/. {{discount()?.mount}}</span>
                <span class="text-green-500">{{ discount()?.percent }} %</span>
            </div>
        }
    </div>
</article>
